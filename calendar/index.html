<!DOCTYPE html>
<html lang="zh-Hant-TW" data-size="1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的月曆・農民曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1EC;
  --card:#FFFFFF;
  --ink:#18211E;
  --muted:#4B5853;
  --line:#C9D1CB;
  --seal:#A8201A;
  --seal-soft:#FBE9E7;
  --gold:#80590F;
  --gold-soft:#F7EED9;
  --jade:#2B5E50;
  --jade-soft:#E1EEE8;
  --outside:#9AA59F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121715; --card:#1C2421; --ink:#EEF3EF; --muted:#B3C0BA; --line:#36433E;
    --seal:#FF7D70; --seal-soft:#3A1F1C; --gold:#E9BE62; --gold-soft:#332A16;
    --jade:#86CDB6; --jade-soft:#1D332C; --outside:#66736D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121715; --card:#1C2421; --ink:#EEF3EF; --muted:#B3C0BA; --line:#36433E;
  --seal:#FF7D70; --seal-soft:#3A1F1C; --gold:#E9BE62; --gold-soft:#332A16;
  --jade:#86CDB6; --jade-soft:#1D332C; --outside:#66736D; color-scheme:dark;
}
html{font-size:20px;scroll-padding-top:env(safe-area-inset-top,0px)}
html[data-size="2"]{font-size:23px}
html[data-size="3"]{font-size:26px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--jade);outline-offset:3px}

.wrap{max-width:1280px;margin:0 auto;padding:1rem clamp(.75rem,3vw,2rem) 2.5rem}

/* ---------- 頂部：即時時鐘 ---------- */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem 1.5rem;margin-bottom:1.25rem}
.now{display:flex;align-items:baseline;flex-wrap:wrap;gap:.25rem 1rem}
.now-time{font-family:var(--serif);font-weight:900;font-size:2.6rem;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.now-time small{font-size:.45em;font-weight:600;margin-right:.3em;color:var(--muted)}
.now-sec{font-size:.5em;color:var(--muted);margin-left:.15em}
.now-date{font-size:1.15rem;font-weight:700}
.now-date span{color:var(--muted);font-weight:500;margin-left:.5em}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:.35rem .9rem;min-height:48px;cursor:pointer;font-weight:700}
.seg button + button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.switch{display:inline-flex;align-items:center;gap:.6rem;min-height:48px;padding:.3rem .9rem .3rem .4rem;border:2px solid var(--ink);border-radius:999px;background:var(--card);font-weight:700;cursor:pointer}
.switch-track{position:relative;width:3.1rem;height:1.7rem;border-radius:999px;background:var(--line);transition:background .2s}
.switch-track::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.switch[aria-pressed="true"] .switch-track{background:var(--jade)}
.switch[aria-pressed="true"] .switch-track::after{transform:translateX(1.4rem)}
.switch-state{min-width:1.2em;color:var(--muted)}
.switch[aria-pressed="true"] .switch-state{color:var(--jade)}
@media (prefers-reduced-motion:reduce){.switch-track,.switch-track::after{transition:none}}
.seg-label{font-size:.9rem;color:var(--muted);margin-right:.25rem}

/* ---------- 主版面 ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem}
@media (min-width:1000px){.main{grid-template-columns:minmax(330px,400px) minmax(0,1fr);align-items:start}}
.main.no-page{grid-template-columns:minmax(0,1fr)}
.page[hidden]{display:none}

/* ---------- 撕日曆頁 ---------- */
.page{position:relative;background:var(--card);border-radius:6px 6px 14px 14px;box-shadow:0 1px 0 var(--line),0 10px 0 -5px var(--card),0 11px 0 -5px var(--line),0 20px 0 -10px var(--card),0 21px 0 -10px var(--line);overflow:hidden}
@media (min-width:1000px){.page{position:sticky;top:calc(env(safe-area-inset-top,0px) + 1rem)}}
.page-head{background:var(--seal);color:#fff;padding:1.1rem 1.25rem .8rem;display:flex;justify-content:space-between;align-items:flex-end;position:relative}
:root[data-theme="dark"] .page-head{color:#1C0A08}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .page-head{color:#1C0A08}}
.page-head::before,.page-head::after{content:"";position:absolute;top:.45rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--paper)}
.page-head::before{left:30%}.page-head::after{right:30%}
.page-ym{font-family:var(--serif);font-weight:900;font-size:1.35rem}
.page-wd{font-size:1.2rem;font-weight:700}
.page-body{padding:1rem 1.25rem 1.4rem;text-align:center}
.badge-row{min-height:2.4rem;display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem}
.badge{display:inline-block;padding:.15rem .8rem;border-radius:999px;font-weight:700;font-size:.95rem;border:2px solid currentColor}
.badge.today{background:var(--seal);border-color:var(--seal);color:var(--card)}
.badge.fest{color:var(--seal)}
.badge.term{color:var(--gold)}
.badge.work{color:var(--jade)}
.big-day{font-family:var(--serif);font-weight:900;font-size:clamp(6rem,24vw,9rem);line-height:1;margin:.3rem 0 .2rem;font-variant-numeric:tabular-nums}
.big-day.red{color:var(--seal)}
.lunar-line{font-family:var(--serif);font-weight:900;font-size:1.7rem;letter-spacing:.08em}
.gz-line{color:var(--muted);font-size:1.05rem;margin-top:.15rem}
.yiji{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1.1rem;text-align:left}
.yj{border:2px solid var(--line);border-radius:10px;padding:.6rem .75rem;display:flex;gap:.6rem;align-items:flex-start}
.yj-mark{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:1.35rem}
.yj.yi .yj-mark{background:var(--seal);color:var(--card)}
.yj.ji .yj-mark{background:var(--ink);color:var(--card)}
.yj-list{font-size:1.05rem;line-height:1.5;font-weight:700;display:flex;flex-wrap:wrap;gap:.1rem .7rem;padding-top:.25rem}
.meta{display:flex;justify-content:center;flex-wrap:wrap;gap:.3rem 1.2rem;margin-top:.9rem;font-size:1rem}
.meta b{color:var(--jade)}
.sc-title{margin:1.1rem 0 .5rem;font-weight:700;text-align:left;font-size:1rem;color:var(--muted)}
.shichen{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
.sc{border:1px solid var(--line);border-radius:8px;padding:.3rem .2rem;line-height:1.3;text-align:center}
.sc b{display:block;font-size:1rem}
.sc span{font-size:.78rem;color:var(--muted)}
.sc.cur{background:var(--jade);border-color:var(--jade);color:var(--card)}
.sc.cur span{color:var(--card)}
.back-today{margin-top:1rem;width:100%;min-height:56px;border:2px solid var(--seal);color:var(--seal);background:var(--seal-soft);border-radius:10px;font-weight:700;font-size:1.1rem;cursor:pointer}

/* ---------- 月曆 ---------- */
.cal{background:var(--card);border-radius:14px;padding:1rem clamp(.5rem,2vw,1.25rem) 1.25rem;border:1px solid var(--line)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-bottom:.9rem}
.cal-title{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.cal-title select{font-family:var(--serif);font-weight:900;font-size:1.5rem;border:2px solid var(--line);border-radius:10px;background:var(--card);padding:.1rem .4rem;min-height:52px;cursor:pointer}
.cal-sub{width:100%;color:var(--muted);font-size:1rem}
.navbtns{display:flex;gap:.5rem}
.nb{min-height:52px;min-width:52px;padding:0 1rem;border-radius:10px;border:2px solid var(--ink);background:var(--card);font-weight:700;font-size:1.05rem;cursor:pointer}
.nb.primary{background:var(--seal);border-color:var(--seal);color:var(--card)}
.nb:active{transform:translateY(1px)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-weight:700;font-size:1.05rem;padding:.4rem 0;border-bottom:2px solid var(--ink);margin-bottom:.4rem}
.week .we{color:var(--seal)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3rem}
.day{position:relative;border:2px solid transparent;background:none;border-radius:10px;padding:.4rem .15rem .45rem;min-height:6.2rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.1rem;text-align:center}
.day:hover{background:var(--jade-soft)}
.d-num{font-family:var(--serif);font-weight:900;font-size:1.65rem;line-height:1.1;font-variant-numeric:tabular-nums}
.d-lunar{font-size:.85rem;line-height:1.25;color:var(--muted);font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.d-lunar.m1{color:var(--jade);font-weight:700}
.d-info{display:flex;flex-direction:column;align-items:center;gap:.05rem;font-size:.78rem;line-height:1.2;font-weight:700;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.d-info .fest{color:var(--seal)}
.d-info .term{color:var(--gold)}
.d-info .work{color:var(--jade)}
.d-info .off{color:var(--card);background:var(--seal);border-radius:4px;padding:0 .3em}
.d-info .work.tagged{color:var(--card);background:var(--jade);border-radius:4px;padding:0 .3em}
.day.hol .d-num{color:var(--seal)}
.day.out{opacity:.45}
.day.sel{border-color:var(--jade);background:var(--jade-soft)}
.day.today{background:var(--seal);border-color:var(--seal)}
.day.today .d-num,.day.today .d-lunar,.day.today .d-info span{color:var(--card)}
.day.today .d-info .off,.day.today .d-info .work.tagged{background:none;border:1px solid var(--card)}
.day.today.sel{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--jade)}
.d-tag{position:absolute;top:.15rem;right:.25rem;font-size:.7rem;font-weight:700;color:var(--card);line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin-top:1rem;font-size:.9rem;color:var(--muted)}
.hol-status{width:100%;font-size:.9rem;color:var(--muted)}
.hol-status.ok{color:var(--jade);font-weight:700}
.legend i{display:inline-block;width:1rem;height:1rem;border-radius:4px;vertical-align:-.15rem;margin-right:.35rem}
.foot{margin-top:1.5rem;font-size:.85rem;color:var(--muted);text-align:center}

@media (max-width:640px){
  .now-time{font-size:2.1rem}
  .now-date span{display:block;margin-left:0}
  .d-info{font-size:.64rem;letter-spacing:-.03em}
  .d-info span+span{display:none}
  .day{min-height:5.2rem;padding:.3rem .05rem}
  .d-num{font-size:1.35rem}
  .d-lunar{font-size:.72rem}
  .d-tag{display:none}
  .grid{gap:.15rem}
  .cal-title select{font-size:1.2rem}
  .nb{padding:0 .7rem}
  .yiji{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){
  .page-body.flip{animation:flip .35s ease-out}
  @keyframes flip{from{opacity:.2;transform:translateY(-8px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="now" aria-live="off">
      <div class="now-time" id="nowTime">--:--</div>
      <div class="now-date" id="nowDate"></div>
    </div>
    <div class="tools">
      <button type="button" class="switch" id="almToggle" aria-pressed="false" aria-controls="page">
        <span class="switch-track" aria-hidden="true"></span>
        <span>當日農民曆</span>
        <span class="switch-state" id="almState">關</span>
      </button>
      <span class="seg-label" id="sizeLbl">字體</span>
      <div class="seg" role="group" aria-labelledby="sizeLbl" id="sizeSeg">
        <button type="button" data-size="1">標準</button>
        <button type="button" data-size="2">大</button>
        <button type="button" data-size="3">特大</button>
      </div>
      <div class="seg" role="group" aria-label="畫面亮度" id="themeSeg">
        <button type="button" data-theme="light">亮</button>
        <button type="button" data-theme="dark">暗</button>
      </div>
    </div>
  </header>

  <main class="main no-page" id="main">
    <section class="page" aria-label="當日農民曆" id="page" hidden>
      <div class="page-head">
        <div class="page-ym" id="pYM"></div>
        <div class="page-wd" id="pWD"></div>
      </div>
      <div class="page-body" id="pBody">
        <div class="badge-row" id="pBadges"></div>
        <div class="big-day" id="pDay"></div>
        <div class="lunar-line" id="pLunar"></div>
        <div class="gz-line" id="pGZ"></div>
        <div class="yiji">
          <div class="yj yi"><div class="yj-mark" aria-hidden="true">宜</div><div class="yj-list" id="pYi"></div></div>
          <div class="yj ji"><div class="yj-mark" aria-hidden="true">忌</div><div class="yj-list" id="pJi"></div></div>
        </div>
        <div class="meta" id="pMeta"></div>
        <div class="sc-title" id="scTitle">十二時辰</div>
        <div class="shichen" id="pSC"></div>
        <button type="button" class="back-today" id="backToday" hidden>回到今天</button>
      </div>
    </section>

    <section class="cal" aria-label="月曆">
      <div class="cal-nav">
        <div class="cal-title">
          <label class="sr" for="selY" style="position:absolute;left:-9999px">年份</label>
          <select id="selY"></select>
          <label class="sr" for="selM" style="position:absolute;left:-9999px">月份</label>
          <select id="selM"></select>
        </div>
        <div class="navbtns">
          <button type="button" class="nb" id="prev" aria-label="上個月">‹ 上月</button>
          <button type="button" class="nb primary" id="today">今天</button>
          <button type="button" class="nb" id="next" aria-label="下個月">下月 ›</button>
        </div>
        <div class="cal-sub" id="calSub"></div>
      </div>
      <div class="week" aria-hidden="true">
        <div class="we">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="we">六</div>
      </div>
      <div class="grid" id="grid" role="grid" aria-label="日期"></div>
      <div class="legend">
        <span><i style="background:var(--seal)"></i>今天</span>
        <span><i style="background:var(--jade-soft);border:2px solid var(--jade)"></i>正在查看</span>
        <span style="color:var(--seal);font-weight:700">紅色日期：放假日</span>
        <span><i style="background:var(--jade)"></i>補班（要上班）</span>
        <span><i style="background:var(--seal)"></i>補假</span>
        <span style="color:var(--gold);font-weight:700">金字：節氣</span>
        <span class="hol-status" id="holStatus" aria-live="polite"></span>
      </div>
    </section>
  </main>
  <p class="foot">點右上角「當日農民曆」可開啟或關閉宜忌、沖煞、時辰等詳細資訊。宜忌依建除十二神簡化推算，僅供參考。可用鍵盤方向鍵選日期、PageUp／PageDown 換月；手機可左右滑動月曆換月。</p>
</div>

    const dt = new Date(y, m-1, d), wd = dt.getDay();
    const inf = Almanac.info(y, m, d);
    const today = isToday(y, m, d);
    $('pYM').textContent = y + ' 年 ' + m + ' 月';
    $('pWD').textContent = '星期' + WD[wd];
    const badges = [];
    if (today) badges.push('<span class="badge today">今天</span>');
    inf.festivals.forEach(f => badges.push('<span class="badge fest">' + f + '</span>'));
    if (inf.term) badges.push('<span class="badge term">' + inf.term + '</span>');
    const H = holidayOf(y, m, d, wd, inf);
    if (H.tag === '補班') badges.push('<span class="badge work">補班（要上班）</span>');
    else if (H.desc && H.red) {
      const known = inf.festivals.concat(inf.term ? [inf.term] : []);
      if (!known.some(f => H.desc.includes(f) || f.includes(H.desc)))
        badges.push('<span class="badge fest">' + esc(H.desc) + '</span>');
    }
    $('pBadges').innerHTML = badges.join('');
    const pd = $('pDay');
    pd.textContent = d;
    pd.classList.toggle('red', H.red);
    $('pLunar').textContent = '農曆 ' + inf.monthText.slice(0,-1) + inf.dayText;
    $('pGZ').textContent = inf.lunarYearGZ + '年（' + inf.animal + '年） ' + inf.pillars.month + '月 ' + inf.pillars.day + '日';
    $('pYi').innerHTML = inf.yi.map(x => '<span>' + x + '</span>').join('');
    $('pJi').innerHTML = inf.ji.map(x => '<span>' + x + '</span>').join('');
    $('pMeta').innerHTML = '<span><b>' + inf.chong + '</b></span><span><b>' + inf.sha + '</b></span><span>值日：<b>' + inf.jianchu + '日</b></span>' +
      '<span>農曆' + inf.monthText.slice(0,-1) + '（' + (inf.monthText.slice(-1) === '大' ? '大月 30 天' : '小月 29 天') + '）</span>';

    const list = Almanac.shichen(inf.pillars.dayStem);
    $('pSC').innerHTML = list.map(s =>
      '<div class="sc"><b>' + s.gz + '</b><span>' + pad(s.start) + '–' + pad(s.end) + '</span></div>').join('');
    $('scTitle').textContent = today ? '十二時辰（綠色為現在時刻）' : '十二時辰';
    markShichen();
    $('backToday').hidden = today;

    const body = $('pBody');
    if (animate) { body.classList.remove('flip'); void body.offsetWidth; body.classList.add('flip'); }
  }

  /* --- 操作 --- */
  function clampYM(y, m){
    if (y < MIN_Y) return [MIN_Y, 1];
    if (y > MAX_Y) return [MAX_Y, 12];
    return [y, m];
  }
  function goMonth(y, m){
    while (m < 1) { m += 12; y--; }
    while (m > 12) { m -= 12; y++; }
    [y, m] = clampYM(y, m);
    view = { y, m };
    const dim = new Date(y, m, 0).getDate();
    sel = { y, m, d: Math.min(sel.d, dim) };
    if (y === now.getFullYear() && m === now.getMonth()+1) sel.d = now.getDate();
    renderGrid(); renderPage(true);
  }
  function select(y, m, d, focus){
    if (y < MIN_Y || y > MAX_Y) return;
    sel = { y, m, d };
    if (y !== view.y || m !== view.m) view = { y, m };
    renderGrid(); renderPage(true);
    if (focus) { const el = document.querySelector('.day.sel'); if (el) el.focus(); }
    if (showPage && matchMedia('(max-width: 999px)').matches && !focus) {
      $('page').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    }
  }
  function goToday(){ select(now.getFullYear(), now.getMonth()+1, now.getDate()); }

  $('prev').addEventListener('click', () => goMonth(view.y, view.m - 1));
  $('next').addEventListener('click', () => goMonth(view.y, view.m + 1));
  $('today').addEventListener('click', goToday);
  $('backToday').addEventListener('click', goToday);

  $('grid').addEventListener('keydown', e => {
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
    if (step) {
      e.preventDefault();
      const dt = new Date(sel.y, sel.m-1, sel.d + step);
      select(dt.getFullYear(), dt.getMonth()+1, dt.getDate(), true);
    }
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return;
    if (e.key === 'PageUp') { e.preventDefault(); goMonth(view.y, view.m - 1); }
    if (e.key === 'PageDown') { e.preventDefault(); goMonth(view.y, view.m + 1); }
  });

  // 手機左右滑動換月
  let tx = null, ty = null;
  const g = $('grid');
  g.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  g.addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) goMonth(view.y, view.m + (dx < 0 ? 1 : -1));
    tx = null;
  });

  renderGrid(); renderPage(false); tick();
  setTimeout(() => { tick(); setInterval(tick, 1000); }, 1000 - (Date.now() % 1000));
})();
</script>
</body>
</html>
