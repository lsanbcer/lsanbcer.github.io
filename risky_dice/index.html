<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>風險骰子</title>
  <!-- 載入 Three.js 與 Canvas-Confetti 庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 頂部與底部 UI (RWD) */
    .ui-layer {
      position: relative;
      z-index: 10;
      pointer-events: none;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
    }
    
    header {
      margin-top: clamp(16px, 4vh, 36px);
      text-align: center;
      color: #fff;
      text-shadow: 0 0 12px rgba(255,255,255,0.4);
    }
    header h1 {
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      letter-spacing: clamp(2px, 1vw, 4px);
      font-weight: 700;
      background: linear-gradient(45deg, #ffffff, #a0a0c0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      font-size: clamp(0.75rem, 2.8vw, 0.95rem);
      color: #a0a0c0;
      margin-top: 6px;
      white-space: nowrap;
    }

    .controls {
      margin-bottom: clamp(24px, 6vh, 50px);
      pointer-events: auto;
    }
    .roll-btn {
      padding: clamp(12px, 2.5vh, 18px) clamp(32px, 8vw, 56px);
      font-size: clamp(1rem, 3.8vw, 1.3rem);
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #4d3833, #6e524b);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
      letter-spacing: 2px;
    }
    .roll-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
      background: linear-gradient(135deg, #5c433d, #806058);
    }
    .roll-btn:active {
      transform: translateY(1px) scale(0.98);
    }
    .roll-btn:disabled {
      background: #332421;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* 特效塗層 */
    #lightning-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0);
      pointer-events: none;
      z-index: 20;
      transition: background 0.05s ease;
    }

    /* 結果彈窗 (RWD 響應式調整) */
    .result-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: min(88vw, 420px);
      padding: clamp(20px, 4vh, 32px) clamp(20px, 5vw, 40px);
      border-radius: 20px;
      text-align: center;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .result-modal.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    /* 大吉樣式 */
    .result-modal.daji {
      background: rgba(77, 56, 51, 0.95);
      border: 2px solid #ffffff;
      box-shadow: 0 0 50px rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }
    .result-modal.daji h2 {
      font-size: clamp(2.5rem, 8vw, 3.8rem);
      letter-spacing: 6px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }
    .result-modal.daji p {
      font-size: clamp(0.95rem, 3.2vw, 1.2rem);
      color: #e0e0e0;
      font-weight: bold;
    }

    /* 大凶樣式 */
    .result-modal.daxiong {
      background: rgba(20, 15, 15, 0.95);
      border: 2px solid #ff3333;
      box-shadow: 0 0 50px rgba(255, 51, 51, 0.5);
      color: #ff3333;
    }
    .result-modal.daxiong h2 {
      font-size: clamp(2.5rem, 8vw, 3.8rem);
      letter-spacing: 6px;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(255, 51, 51, 0.8);
    }
    .result-modal.daxiong p {
      font-size: clamp(0.95rem, 3.2vw, 1.2rem);
      color: #ff9999;
    }

    /* 震動動畫 */
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      40% { transform: translate(1px, -1px) rotate(-1deg); }
      60% { transform: translate(-2px, 2px) rotate(0deg); }
      80% { transform: translate(2px, 1px) rotate(1deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    .shake-screen {
      animation: shake 0.5s ease-in-out infinite;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="lightning-overlay"></div>

  <div class="ui-layer">
    <header>
      <h1>二十面體的骰子</h1>
      <p>1 面是大凶｜19 面是大吉｜出現大吉的話，會發生非常棒的事；但若出現大凶，會發生足以抵消過去所有大吉的不幸。</p>
    </header>
  </div>

  <div class="ui-layer controls">
    <button id="roll-btn" class="roll-btn" onclick="rollDice()">擲 骰 子</button>
  </div>

  <!-- 結果提示彈窗 -->
  <div id="result-modal" class="result-modal">
    <h2 id="modal-title">大吉</h2>
    <p id="modal-sub">恭喜！諸事大吉，好運連連！</p>
  </div>

  <script>
    // --- 聲音合成器 (Web Audio API) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 播放骰子翻滾撞擊聲 (滾動過程呼叫)
    function playDiceClick() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      // 隨機頻率模擬骰子不同面碰撞撞擊聲
      const freq = 200 + Math.random() * 300;
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.04);
      
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    // 播放大吉慶祝音 (Maj Chord)
    function playVictorySound() {
      initAudio();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.08 + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + index * 0.08);
        osc.stop(audioCtx.currentTime + index * 0.08 + 0.6);
      });
    }

    // 播放大凶閃電雷鳴聲
    function playThunderSound() {
      initAudio();
      const bufferSize = audioCtx.sampleRate * 1.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1.2);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      whiteNoise.start();
      whiteNoise.stop(audioCtx.currentTime + 1.2);
    }

    // --- Three.js 3D 骰子場景設定 ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // 根據視窗寬度動態計算並設定 Camera 距離
    function updateCameraPosition() {
      const aspect = window.innerWidth / window.innerHeight;
      if (aspect < 0.8) {
        camera.position.z = 8.5 / aspect;
      } else if (aspect < 1.2) {
        camera.position.z = 8.5;
      } else {
        camera.position.z = 7.0;
      }
    }
    updateCameraPosition();

    // 光源
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight1.position.set(5, 10, 7);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);

    // 建立 20 面 Texture (直書 + 置中)
    function createFaceTexture(text, isDaxiong) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = 'rgb(77, 56, 51)';
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = isDaxiong ? '#ff3333' : '#ffffff';
      ctx.font = 'bold 85px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      const char1 = text.charAt(0);
      const char2 = text.charAt(1);
      
      const centerY = 280;
      const spacing = 80;

      ctx.fillText(char1, 256, centerY - spacing / 2);
      ctx.fillText(char2, 256, centerY + spacing / 2);

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    const texDaji = createFaceTexture('大吉', false);
    const texDaxiong = createFaceTexture('大凶', true);

    // 建立正二十面體 Mesh
    const geometry = new THREE.IcosahedronGeometry(1.8, 0);
    
    const materials = [];
    for (let i = 0; i < 20; i++) {
      const isDaxiong = (i === 0);
      materials.push(new THREE.MeshStandardMaterial({
        map: isDaxiong ? texDaxiong : texDaji,
        roughness: 0.4,
        metalness: 0.05
      }));
    }

    const pos = geometry.attributes.position;
    geometry.clearGroups();
    for (let i = 0; i < 20; i++) {
      geometry.addGroup(i * 3, 3, i);
    }

    const uvs = [];
    for (let i = 0; i < 20; i++) {
      uvs.push(
        0.5, 0.9,
        0.0, 0.1,
        1.0, 0.1
      );
    }
    geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));

    const dice = new THREE.Mesh(geometry, materials);
    scene.add(dice);

    // --- 算出各面對應的法向量與旋轉目標角度 ---
    const faceNormals = [];
    const positionAttribute = geometry.attributes.position;
    for (let i = 0; i < 20; i++) {
      const pA = new THREE.Vector3().fromBufferAttribute(positionAttribute, i * 3);
      const pB = new THREE.Vector3().fromBufferAttribute(positionAttribute, i * 3 + 1);
      const pC = new THREE.Vector3().fromBufferAttribute(positionAttribute, i * 3 + 2);
      
      const cb = new THREE.Vector3().subVectors(pC, pB);
      const ab = new THREE.Vector3().subVectors(pA, pB);
      cb.cross(ab).normalize();
      faceNormals.push(cb);
    }

    // 滾動狀態控制
    let isRolling = false;
    let rollStartTime = 0;
    const rollDuration = 2500;
    let startRotation = new THREE.Euler();
    let targetRotation = new THREE.Euler();
    let selectedResultIndex = 1;
    let lastAngleForSound = 0;

    function rollDice() {
      if (isRolling) return;
      
      initAudio();
      hideModal();

      isRolling = true;
      document.getElementById('roll-btn').disabled = true;

      const isBadLuck = Math.random() < 0.05;
      selectedResultIndex = isBadLuck ? 0 : Math.floor(Math.random() * 19) + 1;

      const targetNormal = faceNormals[selectedResultIndex].clone();
      
      const quaternion = new THREE.Quaternion();
      quaternion.setFromUnitVectors(targetNormal, new THREE.Vector3(0, 0, 1));

      const extraRoundsX = (Math.floor(Math.random() * 3) + 3) * Math.PI * 2;
      const extraRoundsY = (Math.floor(Math.random() * 3) + 3) * Math.PI * 2;

      startRotation.copy(dice.rotation);
      
      const targetEuler = new THREE.Euler().setFromQuaternion(quaternion);
      targetRotation.set(
        targetEuler.x + extraRoundsX,
        targetEuler.y + extraRoundsY,
        targetEuler.z
      );

      rollStartTime = performance.now();
      lastAngleForSound = dice.rotation.x + dice.rotation.y + dice.rotation.z;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function triggerEffects(isBadLuck) {
      const modal = document.getElementById('result-modal');
      const modalTitle = document.getElementById('modal-title');
      const modalSub = document.getElementById('modal-sub');

      modal.className = 'result-modal ' + (isBadLuck ? 'daxiong' : 'daji');

      if (isBadLuck) {
        modalTitle.innerText = '大凶';
        modalSub.innerText = '雷鳴轟頂！請多保重...';
        
        playThunderSound();

        const overlay = document.getElementById('lightning-overlay');
        document.body.classList.add('shake-screen');
        
        let flashCount = 0;
        const flashInterval = setInterval(() => {
          overlay.style.background = flashCount % 2 === 0 ? 'rgba(255, 255, 255, 0.9)' : 'rgba(0, 0, 0, 0)';
          flashCount++;
          if (flashCount > 5) {
            clearInterval(flashInterval);
            overlay.style.background = 'rgba(0, 0, 0, 0)';
            document.body.classList.remove('shake-screen');
          }
        }, 60);

      } else {
        modalTitle.innerText = '大吉';
        modalSub.innerText = '恭喜！諸事大吉，好運連連！';

        playVictorySound();

        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 },
          colors: ['#ffffff', '#ff9100', '#00e676', '#ff4081', '#29b6f6']
        });
      }

      setTimeout(() => {
        modal.classList.add('show');
      }, 200);
    }

    function hideModal() {
      const modal = document.getElementById('result-modal');
      modal.classList.remove('show');
    }

    function animate(time) {
      requestAnimationFrame(animate);

      if (isRolling) {
        const elapsed = time - rollStartTime;
        const progress = Math.min(elapsed / rollDuration, 1);
        const easeProgress = easeOutCubic(progress);

        dice.rotation.x = startRotation.x + (targetRotation.x - startRotation.x) * easeProgress;
        dice.rotation.y = startRotation.y + (targetRotation.y - startRotation.y) * easeProgress;
        dice.rotation.z = startRotation.z + (targetRotation.z - startRotation.z) * easeProgress;

        dice.position.y = Math.sin(progress * Math.PI) * 1.2;

        // 旋轉角度差達到閾值時觸發滾動音效（體現轉速越快聲音越密）
        const currentAngleSum = dice.rotation.x + dice.rotation.y + dice.rotation.z;
        if (Math.abs(currentAngleSum - lastAngleForSound) > 0.65) {
          playDiceClick();
          lastAngleForSound = currentAngleSum;
        }

        if (progress >= 1) {
          isRolling = false;
          document.getElementById('roll-btn').disabled = false;
          triggerEffects(selectedResultIndex === 0);
        }
      } else {
        dice.rotation.y += 0.005;
        dice.rotation.x += 0.002;
        dice.position.y = Math.sin(time * 0.002) * 0.1;
      }

      renderer.render(scene, camera);
    }

    // 響應式視窗調整
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      updateCameraPosition();
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 啟動動畫
    animate(0);
  </script>
</body>
</html>
